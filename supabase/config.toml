# Local Supabase settings for `supabase start`. Production settings live in the
# Supabase dashboard; see docs/setup.md.
project_id = "drivo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "fj.kaitech.drivo://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Owners and Admins add people. Sign-in never creates accounts.
enable_signup = false

[auth.email]
# Email and password sign-in is on; new sign-ups are off ([auth] enable_signup).
enabled = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6
otp_expiry = 3600
